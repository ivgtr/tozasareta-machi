name: Issue 46 Preflight

on:
  push:
    branches: [ci/issue-46-ending-epilogue-preflight]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npm run playwright -- install --with-deps chromium
      - name: Production build smoke test
        run: npm run test:prod
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Generate visual baselines
        run: UPDATE_VISUAL_BASELINES=1 npm run test:visual
      - name: Verify visual regression determinism
        run: npm run test:visual
      - name: Upload ending baselines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-46-ending-baselines
          path: |
            tests/visual-baselines/ending-wide.png
            tests/visual-baselines/ending-narrow.png
            tests/visual-baselines/ending-sacrifice-wide.png
            tests/visual-baselines/ending-sacrifice-narrow.png
            tests/visual-baselines/ending-governance-wide.png
            tests/visual-baselines/ending-governance-narrow.png
            tests/visual-baselines/ending-collapse-wide.png
            tests/visual-baselines/ending-collapse-narrow.png
          if-no-files-found: error
          retention-days: 1
