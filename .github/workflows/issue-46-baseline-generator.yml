name: Issue 46 Baseline Generator

on:
  push:
    branches: [ci/issue-46-baseline-generator]
    paths-ignore:
      - 'tests/visual-baselines/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npm run playwright -- install --with-deps chromium
      - name: Generate visual baselines
        run: UPDATE_VISUAL_BASELINES=1 npm run test:visual
      - name: Commit ending baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-baselines/ending*.png
          git diff --cached --quiet && exit 0
          git commit -m 'test: generate issue 46 ending baselines'
          git push
