name: Issue 45 Preflight

on:
  push:
    branches: [ci/issue-45-preflight]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npm run playwright -- install --with-deps chromium
      - name: Production build smoke test
        run: npm run test:prod
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Generate story milestone visual baseline
        run: UPDATE_VISUAL_BASELINES=1 node ./scripts/visual-story-milestones.mjs
      - name: Visual regression tests
        run: npm run test:visual
      - name: Publish generated baseline to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines/story-milestones.sig
          git commit -m "ci: capture issue 45 visual baseline"
          git push origin HEAD:refs/heads/ci/issue-45-baseline --force
