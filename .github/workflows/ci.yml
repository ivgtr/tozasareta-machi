name: CI

on:
  push:
    branches: [main, preflight/planning-controls-containment]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write scripts/e2e-planning-polish.mjs
          git diff -- scripts/e2e-planning-polish.mjs
          exit 1
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npm run playwright -- install --with-deps chromium
      - name: Production build smoke test
        run: npm run test:prod
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Visual regression tests
        run: npm run test:visual
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7
