name: CI

on:
  push:
    branches: [main, preflight/narrative-spine-final-qa]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npm run playwright -- install --with-deps chromium
      - name: Prepare final QA visual baselines
        if: github.event_name == 'push' && github.ref_name == 'preflight/narrative-spine-final-qa'
        run: |
          UPDATE_VISUAL_BASELINES=1 node ./scripts/visual-prologue.mjs
          node ./scripts/visual-regression.mjs || true
          for name in ending ending-sacrifice ending-governance ending-collapse; do
            cp "test-results/visual/${name}-wide-actual.png" "tests/visual-baselines/${name}-wide.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines/prologue-wide.png tests/visual-baselines/prologue-narrow.png tests/visual-baselines/ending-wide.png tests/visual-baselines/ending-sacrifice-wide.png tests/visual-baselines/ending-governance-wide.png tests/visual-baselines/ending-collapse-wide.png
          if ! git diff --cached --quiet; then
            git commit -m "test: preflight QA visual baselines [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Production build smoke test
        run: npm run test:prod
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Visual regression tests
        run: npm run test:visual
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7
